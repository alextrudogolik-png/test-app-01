<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); padding: 20px; }
        input, select, textarea { width: 100%; margin-bottom: 15px; padding: 10px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; }
        button { width: 100%; background-color: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); border: none; padding: 15px; border-radius: 8px; font-weight: bold; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; }
    </style>
</head>
<body>
    <h3>Запись на прием</h3>
    
    <label>Вид животного (например, Крыса)</label>
    <input type="text" id="species" placeholder="Кто у вас?" required>

    <label>Кличка питомца</label>
    <input type="text" id="name" placeholder="Как зовут?" required>

    <label>Что случилось?</label>
    <textarea id="issue" rows="3" placeholder="Опишите проблему..." required></textarea>

    <label>Желаемое время</label>
    <input type="datetime-local" id="time" required>

    <button id="send">Подтвердить запись</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на всё окно

        document.getElementById('send').addEventListener('click', () => {
            let data = {
                species: document.getElementById('species').value,
                name: document.getElementById('name').value,
                issue: document.getElementById('issue').value,
                time: document.getElementById('time').value
            };
            
            // Проверка на бред (мини-валидация)
            if(data.name.length < 2) { alert("Имя слишком короткое"); return; }

            tg.sendData(JSON.stringify(data)); // Отправка данных боту
            tg.close(); // Закрыть форму
        });
    </script>
</body>
</html>
