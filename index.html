<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); padding: 15px; margin: 0; }
        input, textarea { width: 100%; margin-bottom: 12px; padding: 10px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; background: #fff; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; font-weight: bold; }
        
        /* Стили календаря */
        .calendar-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .nav-btn { width: auto; padding: 5px 15px; background: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); border-radius: 6px; cursor: pointer; border: none; font-size: 0.9em; }
        
        .days-container { display: flex; justify-content: space-between; margin-bottom: 15px; gap: 5px; }
        .day-card { flex: 1; text-align: center; padding: 8px 4px; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; background: #fafafa; color: #333; }
        .day-card.selected { background-color: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); border-color: var(--tg-theme-button-color); }
        .day-card .date-num { font-size: 1.2em; font-weight: bold; }
        .day-card .day-name { font-size: 0.75em; text-transform: uppercase; margin-top: 3px; }

        .slots-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; max-height: 160px; overflow-y: auto; padding: 2px; }
        .slot-btn { padding: 10px 5px; text-align: center; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; background: #fff; color: #333; font-size: 0.9em; }
        .slot-btn.selected { background-color: #2ecc71; color: white; border-color: #2ecc71; }
        .slot-btn.booked { background-color: #e74c3c !important; color: white !important; border-color: #e74c3c !important; cursor: not-allowed; opacity: 0.7; }
        
        #send { width: 100%; background-color: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); border: none; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 1em; cursor: pointer; }
        #send:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <h3>Запись на прием</h3>
    
    <label>Вид животного (например, Крыса)</label>
    <input type="text" id="species" placeholder="Кто у вас?" required>

    <label>Кличка питомца</label>
    <input type="text" id="name" placeholder="Как зовут?" required>

    <label>Что случилось?</label>
    <textarea id="issue" rows="2" placeholder="Опишите проблему..." required></textarea>

    <label>Выберите дату и время приема</label>
    <div class="calendar-nav">
        <button class="nav-btn" id="prev-week">&larr; Пред. неделя</button>
        <span id="current-month" style="font-weight: bold;">Май 2026</span>
        <button class="nav-btn" id="next-week">След. неделя &rarr;</button>
    </div>

    <div class="days-container" id="days-wrapper">
    </div>

    <div class="slots-grid" id="slots-wrapper">
    </div>

    <button id="send" disabled>Подтвердить запись</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const WORK_START = 9;  
        const WORK_END = 18;  
        const SLOT_DURATION = 30; 

        let currentMonday = getMonday(new Date()); 
        let selectedDateStr = null; 
        let selectedTimeStr = null; 

        let bookedSlots = []; 

        async function loadBookedSlots() {
            // Добавляем к URL обманку ?_=временная_метка, чтобы обойти жесткий кэш Телеграма и лимиты Make
            const cacheBuster = Date.now();
            const WEBHOOK_URL = `https://hook.eu1.make.com/mlhj3c3qstea64qcrrbunx559hmbgwa4?_=${cacheBuster}`;
            
            try {
                let response = await fetch(WEBHOOK_URL);
                let data = await response.json();
                
                if (data && data.booked) {
                    bookedSlots = data.booked;
                }
            } catch (error) {
                console.error("Ошибка загрузки занятых слотов:", error);
            }
            
            renderWeek(currentMonday);
        }

        loadBookedSlots();
        renderWeek(currentMonday);

        document.getElementById('prev-week').addEventListener('click', () => {
            currentMonday.setDate(currentMonday.getDate() - 7);
            renderWeek(currentMonday);
        });

        document.getElementById('next-week').addEventListener('click', () => {
            currentMonday.setDate(currentMonday.getDate() + 7);
            renderWeek(currentMonday);
        });

        function getMonday(d) {
            d = new Date(d);
            let day = d.getDay(), diff = d.getDate() - day + (day == 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

        function renderWeek(monday) {
            const wrapper = document.getElementById('days-wrapper');
            wrapper.innerHTML = '';
            
            const daysNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
            let tempDate = new Date(monday);

            document.getElementById('current-month').innerText = tempDate.toLocaleString('ru-RU', { month: 'long', year: 'numeric' });

            for (let i = 0; i < 6; i++) {
                // ФИКС: Собираем дату YYYY-MM-DD строго по локальному времени устройства, без ISO-сдвигов
                let yyyy = tempDate.getFullYear();
                let mm = String(tempDate.getMonth() + 1).padStart(2, '0');
                let dd = String(tempDate.getDate()).padStart(2, '0');
                let dateStr = `${yyyy}-${mm}-${dd}`; 
                
                let dateNum = tempDate.getDate();

                let dayCard = document.createElement('div');
                dayCard.className = 'day-card';
                if (selectedDateStr === dateStr) dayCard.classList.add('selected');
                
                dayCard.innerHTML = `
                    <div class="date-num">${dateNum}</div>
                    <div class="day-name">${daysNames[i]}</div>
                `;

                dayCard.addEventListener('click', () => {
                    document.querySelectorAll('.day-card').forEach(c => c.classList.remove('selected'));
                    dayCard.classList.add('selected');
                    selectedDateStr = dateStr;
                    selectedTimeStr = null; 
                    document.getElementById('send').disabled = true;
                    renderSlots(dateStr);
                });

                wrapper.appendChild(dayCard);
                tempDate.setDate(tempDate.getDate() + 1);
            }
            document.getElementById('slots-wrapper').innerHTML = '';
        }

        function renderSlots(dateStr) {
            const wrapper = document.getElementById('slots-wrapper');
            wrapper.innerHTML = '';

            let totalMinutes = (WORK_END - WORK_START) * 60;
            let steps = totalMinutes / SLOT_DURATION;

            // Жестко берем текущее локальное время устройства без ISO-сдвигов
            let now = new Date();

            for (let i = 0; i < steps; i++) {
                let currentMinutes = (WORK_START * 60) + (i * SLOT_DURATION);
                let hours = Math.floor(currentMinutes / 60);
                let minutes = currentMinutes % 60;

                let timeStr = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
                let fullDateTimeStr = `${dateStr} ${timeStr}`;

                let slotBtn = document.createElement('div');
                slotBtn.className = 'slot-btn';
                slotBtn.innerText = timeStr;

                // Парсим дату и время слота строго по локальному времени смартфона
                let [year, month, day] = dateStr.split('-').map(Number);
                let slotDateTime = new Date(year, month - 1, day, hours, minutes, 0);

                // 1. Проверка на прошедшее время (сравниваем чистые локальные объекты)
                if (slotDateTime < now) {
                    slotBtn.classList.add('booked');
                    slotBtn.style.opacity = '0.4'; 
                } 
                // 2. Проверка на занятость в базе
                else if (bookedSlots.includes(fullDateTimeStr)) {
                    slotBtn.classList.add('booked');
                } 
                // 3. Свободный слот
                else {
                    if (selectedTimeStr === timeStr) slotBtn.classList.add('selected');

                    slotBtn.addEventListener('click', () => {
                        document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
                        slotBtn.classList.add('selected');
                        selectedTimeStr = timeStr;
                        document.getElementById('send').disabled = false;
                    });
                }
                wrapper.appendChild(slotBtn);
            }
        }

        // Отправка данных
        document.getElementById('send').addEventListener('click', () => {
            let speciesVal = document.getElementById('species').value.trim();
            let nameVal = document.getElementById('name').value.trim();
            let issueVal = document.getElementById('issue').value.trim();

            // Валидация через системный tg.showAlert, чтобы не блокировалась клавиатура
            if(nameVal.length < 2) { 
                tg.showAlert("Имя слишком короткое! Введите корректное имя питомца."); 
                return; 
            }
            if(!speciesVal || !issueVal) {
                tg.showAlert("Пожалуйста, заполните все поля формы.");
                return;
            }
            if(!selectedDateStr || !selectedTimeStr) { 
                tg.showAlert("Выберите дату и время!"); 
                return; 
            }

            let data = {
                species: speciesVal,
                name: nameVal,
                issue: issueVal,
                time: `${selectedDateStr} ${selectedTimeStr}` 
            };

            tg.sendData(JSON.stringify(data));
            tg.close();
        });
    </script>
</body>
</html>
